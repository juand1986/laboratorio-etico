<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio Ético 2</title><style>body{font-family:system-ui;background:#09111f;color:#e8f0ff;min-height:100vh;display:grid;place-items:center;margin:0}.card{background:#17243b;border:1px solid #344761;border-radius:22px;padding:28px;max-width:420px;width:82%}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0 16px;border-radius:12px;border:1px solid #435574;font-size:16px}input{background:#0b1729;color:white}button{background:#3585ff;color:white;font-weight:bold;border:0}small,p{color:#b7c6dc}#results{display:none}li{margin:12px 0}</style></head><body><main class="card"><small>LABORATORIO ÉTICO · DEMOSTRACIÓN</small><section id="login"><h1>Acceso de prueba</h1><p>Usá únicamente datos ficticios. Esta página no solicita ni almacena contraseñas.</p><label>Usuario ficticio<input id="user" placeholder="usuario_demo" autocomplete="off"></label><button onclick="attempt()">Simular inicio de sesión</button><p id="message" role="status"></p><button onclick="showResults()" style="background:#293d5c">Ver resultados locales</button></section><section id="results"><h1>Resultados locales</h1><p>Solo se muestran los intentos realizados en este navegador. No se envían datos a ningún servidor.</p><ul id="events"></ul><button onclick="showLogin()">Volver</button><button onclick="clearResults()" style="background:#293d5c">Borrar historial</button></section></main><script>const key='lab_etico_2_events';function attempt(){const u=document.getElementById('user').value.trim();if(!u){document.getElementById('message').textContent='Escribí un usuario ficticio.';return}const ok=u==='usuario_demo';const events=JSON.parse(localStorage.getItem(key)||'[]');events.unshift({user:u,time:new Date().toLocaleString('es-ES'),result:ok?'Correcto':'Incorrecto'});localStorage.setItem(key,JSON.stringify(events.slice(0,30)));document.getElementById('message').textContent=ok?'✓ Simulación correcta':'× Usuario ficticio no reconocido'}function showResults(){document.getElementById('login').style.display='none';document.getElementById('results').style.display='block';const e=JSON.parse(localStorage.getItem(key)||'[]');document.getElementById('events').replaceChildren(...e.map(x=>{const li=document.createElement('li');li.textContent=x.result+' · '+x.user+' · '+x.time;return li}));if(!e.length)document.getElementById('events').textContent='Sin intentos todavía.'}function showLogin(){document.getElementById('login').style.display='block';document.getElementById('results').style.display='none'}function clearResults(){localStorage.removeItem(key);showResults()}</script></body></html>
